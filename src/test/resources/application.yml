# 테스트는 외부 인프라(MySQL · Redis) 없이 돌아야 한다. CI 에서도 그대로 사용한다.
spring:
  datasource:
    url: jdbc:h2:mem:getit;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

getit:
  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  level:
    root: warn
    com.getit: info
