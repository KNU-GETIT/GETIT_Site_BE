# dev 배포 환경. 값은 전부 환경변수로 주입한다 (GitHub Actions Secrets / 서버 환경변수).
spring:
  # 스키마 변경은 마이그레이션으로만 반영한다. ddl-auto 는 validate 로 고정.
  flyway:
    enabled: true
    baseline-on-migrate: true

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

getit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.getit: debug
